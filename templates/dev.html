<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>待ち人数可視化（PoC）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#f8f9fa; --fg:#222; --muted:#6c757d; --card:#fff; --line:#ddd;
      --ok:#28a745; --mid:#ff9800; --bad:#dc3545; --idle:#e9ecef;
    }
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      padding:1.2rem; display:flex; flex-direction:column; gap:1rem;
    }
    header,footer{display:flex; align-items:center; justify-content:space-between}
    h1{margin:0; font-size:clamp(1.4rem, 2.2vw, 2rem); font-weight:700}
    .clock{color:var(--muted); font-size:clamp(1rem,1.8vw,1.2rem)}

    .grid{display:grid; gap:1.2rem; grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
    .panel{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:1.6rem; box-shadow:0 4px 12px rgba(0,0,0,.08)}
    .title{display:flex; align-items:center; justify-content:center; gap:.6rem; font-size:clamp(1.2rem,2.4vw,1.8rem); font-weight:700; margin-bottom:1rem}
    .badge{padding:.35rem .8rem; border-radius:999px; font-weight:700; font-size:clamp(.9rem,1.6vw,1rem)}
    .badge.ok{background:var(--ok); color:#fff}
    .badge.mid{background:var(--mid); color:#222}
    .badge.bad{background:var(--bad); color:#fff}

    .wrap{display:flex; gap:1.6rem; align-items:center; justify-content:center; flex-wrap:wrap}
    .gauge{width:clamp(140px,32vw,240px); height:clamp(140px,32vw,240px); border-radius:50%;
      display:grid; place-items:center; background: conic-gradient(var(--gauge-color) calc(var(--pct) * 1%), #e9ecef 0); position:relative;}
    .gauge::after{content:""; position:absolute; inset:8%; background:#fff; border-radius:50%; border:1px solid var(--line)}
    .gauge-content{position:absolute; text-align:center}
    .big{font-size:clamp(2.4rem,6vw,5rem); font-weight:800; line-height:1}
    .sub{color:var(--muted); font-size:clamp(1rem,1.8vw,1.2rem)}

    .bar{display:flex; gap:.5rem; width:100%}
    .slot{flex:1; height:28px; border-radius:6px; background:var(--idle)}
    .slot.used.ok{background:var(--ok)} .slot.used.mid{background:var(--mid)} .slot.used.bad{background:var(--bad)}

    .meta{display:flex; gap:1rem; justify-content:center; color:var(--muted); margin-top:.6rem; font-size:clamp(.95rem,1.6vw,1.05rem)}
    .hint{color:var(--muted); font-size:.9rem}
    .danger{position:fixed; left:50%; transform:translateX(-50%); bottom:14px; background:var(--bad); color:#fff; padding:.6rem 1rem; border-radius:999px; font-weight:700; display:none}
    .danger.show{display:block}
    .fs-btn{border:1px solid var(--line); background:#fff; padding:.5rem .8rem; border-radius:10px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.06); font-weight:600}

    /* スパークライン */
    .sparkbox{margin-top:.6rem; display:flex; align-items:center; gap:.6rem; justify-content:center}
    .sparklabel{font-size:.85rem; color:var(--muted)}
    .emoji{font-size:1.3em; line-height:1}

    @media (max-width: 720px){ .wrap{flex-direction: column; align-items: stretch; gap:1rem} .panel{padding:1.2rem} }
  </style>
</head>
<body>
  <header>
    <h1>男子トイレ／喫煙所 利用人数ダッシュボード</h1>
    <div class="clock" id="clock">--:--</div>
  </header>

  <div class="grid" role="list">
    <section class="panel" id="toilet" role="listitem" aria-label="男子トイレ"></section>
    <section class="panel" id="smoking" role="listitem" aria-label="喫煙所"></section>
  </div>

  <footer>
    <div class="hint">
      更新間隔: <span id="intervalView"></span> 秒 ・ しきい値 low=<span id="lowView"></span>, high=<span id="highView"></span>
      ・ キー操作: <b>F</b> 全画面, <b>R</b> 再読込
    </div>
    <button class="fs-btn" id="fsBtn" type="button" aria-label="フルスクリーン切替">全画面</button>
  </footer>

  <div class="danger" id="danger">データ取得エラーが続いています</div>

  <script>
    // ===== URLパラメータ =====
    const url = new URL(location.href);
    const INTERVAL = Math.max(1, Number(url.searchParams.get("interval") || 5)); // 既定5秒
    const LOW = Math.min(1, Math.max(0, Number(url.searchParams.get("low") || 0.5)));
    const HIGH = Math.min(1, Math.max(0, Number(url.searchParams.get("high") || 0.8)));
    intervalView.textContent = INTERVAL; lowView.textContent = LOW; highView.textContent = HIGH;

    // 履歴保持（直近 n 点）
    const HISTORY_POINTS = 30;
    const history = { toilet: [], smoking: [] };

    // ===== util =====
    const $ = (id) => document.getElementById(id);
    const fmtTime = (iso) => new Date(iso).toLocaleTimeString();
    function levelByRatio(r){ if (r >= HIGH) return "bad"; if (r >= LOW) return "mid"; return "ok"; }
    function labelByLevel(lv){ return lv==="bad" ? "混雑" : lv==="mid" ? "やや混雑" : "空きあり"; }
    function emojiByLevel(lv){ return lv==="bad" ? "😫" : lv==="mid" ? "😐" : "😃"; }

    // スパークラインSVGを生成（values: 数値配列, max: スケール上限）
    function sparkline(values, max, width=180, height=40, stroke="#6c757d"){
      if (!values.length || max <= 0) return `<svg width="${width}" height="${height}"></svg>`;
      const n = values.length;
      const step = (width-2) / Math.max(1, n-1);
      const pad = 1;
      const ys = values.map(v => height - pad - (Math.max(0, Math.min(max, v)) / max) * (height-2*pad));
      const xs = Array.from({length:n}, (_,i)=> pad + i*step);
      let d = `M ${xs[0].toFixed(1)} ${ys[0].toFixed(1)}`;
      for (let i=1;i<n;i++){ d += ` L ${xs[i].toFixed(1)} ${ys[i].toFixed(1)}`; }
      const last = values[n-1];
      return `
        <svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" aria-hidden="true">
          <polyline fill="none" stroke="${stroke}" stroke-width="2" points="${xs.map((x,i)=>`${x},${ys[i]}`).join(' ')}" />
          <circle cx="${xs[n-1]}" cy="${ys[n-1]}" r="3" fill="${stroke}" />
        </svg>
      `;
    }

    // fetchにタイムアウトを付与
    async function fetchWithTimeout(resource, {timeout = 4000, ...options} = {}){
      const ctrl = new AbortController();
      const id = setTimeout(()=>ctrl.abort(), timeout);
      try { return await fetch(resource, {...options, signal: ctrl.signal, cache:"no-store"}); }
      finally { clearTimeout(id); }
    }

    // 過度なDOM差し替えを避けてチラつき防止
    function setHTML(el, html){ if (el._html !== html){ el.innerHTML = html; el._html = html; } }

    async function updatePanel(endpoint, el, key, title, icon){
      const danger = $("danger");
      try{
        const t0 = performance.now();
        const res = await fetchWithTimeout(endpoint + "?t=" + Date.now(), {timeout: 4000});
        if(!res.ok) throw new Error("HTTP "+res.status);
        const data = await res.json();
        const latency = Math.round(performance.now() - t0);

        const { in_use, capacity, updated_at } = data;
        const ratio = Math.min(1, in_use / capacity);
        const lv = levelByRatio(ratio);
        const pct = Math.round(ratio * 100);
        const emoji = emojiByLevel(lv);

        // 履歴に追加
        const arr = history[key];
        arr.push(in_use);
        if (arr.length > HISTORY_POINTS) arr.shift();

        // ゲージ色
        el.style.setProperty("--pct", pct);
        el.style.setProperty("--gauge-color", lv==="bad" ? "var(--bad)" : lv==="mid" ? "var(--mid)" : "var(--ok)");

        const spark = sparkline(arr, capacity, 200, 44, lv==="bad" ? "#dc3545" : lv==="mid" ? "#ff9800" : "#28a745");

        const html = `
          <div class="title">${icon} ${title}
            <span class="emoji" aria-hidden="true">${emoji}</span>
            <span class="badge ${lv}">${labelByLevel(lv)}</span>
          </div>
          <div class="wrap" aria-live="polite">
            <div class="gauge" role="img" aria-label="${title} 使用率 ${pct}%">
              <div class="gauge-content">
                <div class="big">${in_use}<span class="sub"> / ${capacity}</span></div>
                <div class="sub">${pct}% 使用中</div>
              </div>
            </div>
            <div>
              <div class="bar" aria-hidden="true">
                ${Array.from({length: capacity}).map((_,i)=> `<div class="slot ${i<in_use ? `used ${lv}`:''}"></div>`).join("")}
              </div>
              <div class="sparkbox">
                <div class="sparklabel">推移</div>
                ${spark}
              </div>
              <div class="meta">
                <div>最終更新: ${fmtTime(updated_at)}</div>
                <div>API: ${latency} ms</div>
              </div>
            </div>
          </div>`;
        setHTML(el, html);

        failureCount = 0; danger.classList.remove("show");
      }catch(e){
        console.error(e); failureCount++;
        if (failureCount >= 3) $("danger").classList.add("show");
        setHTML(el, `<div class="title">${icon} ${title}　<span class="badge bad">取得エラー</span></div>
                     <div class="wrap"><div class="sub">データを取得できませんでした</div></div>`);
      }
    }

    // タブが非表示の間はポーリングを止めて無駄を削減
    let timer = null, failureCount = 0;
    function start(){ if(timer) return; tick(); timer = setInterval(tick, INTERVAL*1000); }
    function stop(){ if(!timer) return; clearInterval(timer); timer = null; }
    function tick(){
      updatePanel("/api/status/toilet", $("toilet"), "toilet", "男子トイレ", "🚻");
      updatePanel("/api/status/smoking", $("smoking"), "smoking", "喫煙所", "🚬");
    }
    document.addEventListener("visibilitychange", ()=> document.hidden ? stop() : start());
    start();

    // 時計
    function clock(){ $("clock").textContent = new Date().toLocaleTimeString(); }
    clock(); setInterval(clock, 1000);

    // フルスクリーン
    fsBtn.addEventListener("click", ()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen().catch(()=>{}); });
    document.addEventListener("keydown", (e)=>{ if(e.key==="f"||e.key==="F") fsBtn.click(); if(e.key==="r"||e.key==="R") location.reload(); });
  </script>
</body>
</html>
